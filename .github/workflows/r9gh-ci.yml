name: r9gh-ci
on:
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check float test
        run: |
          grep -q 'def test_square_float' test_calc.py || { echo "square() needs a test_square_float test"; exit 1; }
