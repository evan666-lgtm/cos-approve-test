name: ci
on:
  pull_request:
    branches: ["shepherd-live/**"]
  push:
    branches: ["shepherd-live/*/base"]
jobs:
  test:
    name: ci / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: curl -sSf https://packages.acme.invalid/simple/ -o /dev/null
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q
